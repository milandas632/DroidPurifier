name: Verify Droid Purifier v1.4.0 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.4.0.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify published v1.4.0 assets
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url > release.json
          cat release.json

      - name: Verify release and report commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY'
          import json
          data = json.load(open('release.json', encoding='utf-8'))
          assert data['tagName'] == 'v1.4.0', data
          assert data['name'] == 'Droid Purifier v1.4.0', data
          assert data['isDraft'] is False, data
          assert data['isPrerelease'] is False, data
          assert data['targetCommitish'] == 'c025547e6f08e05724fcc77d8323c43e4bb78613', data
          assets = {item['name']: item.get('size', 0) for item in data['assets']}
          required = {
              'DroidPurifier-1.4.0-Setup.exe',
              'DroidPurifier-1.4.0-Windows-x64.zip',
          }
          missing = required.difference(assets)
          assert not missing, f'Missing release assets: {sorted(missing)}; found: {sorted(assets)}'
          for name in required:
              assert assets[name] > 1_000_000, f'{name} is unexpectedly small: {assets[name]}'
          print('Verified release:', data['url'])
          print('Assets:', assets)
          PY
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            state=success
            description='v1.4.0 release and Windows assets verified'
          else
            state=failure
            description='v1.4.0 release verification failed'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='release/v1.4.0' \
            -f description="$description" >/dev/null
          exit "$result"
